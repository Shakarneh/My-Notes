name: Build & Release

# Every push:       run the tests and build the Windows installer (downloadable
#                   from the run's "Artifacts" section, for testing).
# Actions → "Run workflow" (on main) with a version: bump the version, tag it,
#                   build, and publish a GitHub Release. Installed apps pick the
#                   release up automatically and update themselves.
# Pushing a tag vX.Y.Z: build and publish that version.
#
# Put [required] anywhere in the release notes to force users to update.

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'New version number, e.g. 1.4.0'
        required: true
      notes:
        description: 'Release notes shown in the app ("- item" per line). Add [required] to force the update.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      INPUT_VERSION: ${{ inputs.version }}
      INPUT_NOTES: ${{ inputs.notes }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pyinstaller>=6.10"

      - name: Unit tests
        run: python -m unittest discover tests -v

      - name: Decide version and whether to release
        id: meta
        shell: pwsh
        run: |
          $release = 'false'
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            if ($env:INPUT_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "Version must look like 1.4.0 (got '$env:INPUT_VERSION')" }
            if ('${{ github.ref }}' -ne 'refs/heads/main') { throw 'Run the release from the main branch.' }
            $current = python -c "import scripts.set_version as s; print(s.current_version())"
            $cmp = python -c "import sys; from app.updater import parse_version as p; print(p(sys.argv[1]) > p(sys.argv[2]))" $env:INPUT_VERSION $current
            if ($cmp -ne 'True') { throw "New version $env:INPUT_VERSION must be higher than the current $current" }
            python scripts/set_version.py $env:INPUT_VERSION
            $version = $env:INPUT_VERSION
            $release = 'true'
          } else {
            $version = python -c "import scripts.set_version as s; print(s.current_version())"
            if ('${{ github.ref_type }}' -eq 'tag') {
              $tagVersion = '${{ github.ref_name }}'.TrimStart('v')
              if ($tagVersion -ne $version) { throw "Tag v$tagVersion does not match APP_VERSION $version in app/api.py" }
              $release = 'true'
            }
          }
          if ($release -eq 'true') {
            gh release view "v$version" 2>$null
            if ($LASTEXITCODE -eq 0) { throw "Release v$version already exists" }
            $global:LASTEXITCODE = 0
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "release=$release" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version, release: $release"

      - name: Build app (PyInstaller)
        run: python -m PyInstaller notes-app.spec --noconfirm

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (!(Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=${{ steps.meta.outputs.version }}" installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyNotes-Setup-v${{ steps.meta.outputs.version }}
          path: installer_output/*.exe
          if-no-files-found: error

      - name: Commit version bump and tag
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $v = '${{ steps.meta.outputs.version }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/api.py installer.iss README.md
          git commit -m "chore: release v$v"
          git tag "v$v"
          git push origin HEAD:main "v$v"

      - name: Publish GitHub Release
        if: steps.meta.outputs.release == 'true'
        shell: pwsh
        run: |
          $v = '${{ steps.meta.outputs.version }}'
          $exe = "installer_output\MyNotes-Setup-v$v.exe"
          if ($env:INPUT_NOTES) {
            Set-Content -Path notes.md -Value ($env:INPUT_NOTES -replace '\\n', "`n") -Encoding utf8
            gh release create "v$v" $exe --title "v$v" --notes-file notes.md
          } else {
            gh release create "v$v" $exe --title "v$v" --generate-notes
          }
